name: RedoX TV - Arayüz önizleme (emülatör ekran görüntüleri)

# Telefon, tablet ve Android TV emülatöründe uygulamayı açar, gezinir ve ekran görüntüleri alır
# (komutlar: ci/capture.sh). Görüntüler iki yere yüklenir:
#   * Actions > Artifacts: "RedoX-TV-ekran-<tür>"
#   * Depodaki "shots-<tür>" dalı (herkese açık depoda doğrudan görüntülenebilir)
# Çalışma: "ui-*" dallarına her push'ta ya da Actions > "Run workflow" ile elle.

on:
  push:
    branches: [ "ui-*" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shots:
    name: ${{ matrix.kind }} ekran görüntüleri
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: phone
            flavor: Phone
            api: 34
            target: google_apis
            arch: x86_64
            profile: pixel_6
          - kind: tablet
            flavor: Tablet
            api: 34
            target: google_apis
            arch: x86_64
            profile: Nexus 10
          - kind: tv
            flavor: Tv
            api: 30
            target: android-tv
            arch: x86
            profile: tv_1080p
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: KVM (emülatör hızlandırma)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Radyo listesini önizlemeden çıkar (herkese açık görüntülerde gerçek liste görünmesin; uydurma örnek liste kullanılır)
        run: rm -f app/src/main/assets/radios.enc

      - name: Derle (assemble${{ matrix.flavor }}Debug)
        run: gradle --no-daemon ":app:assemble${{ matrix.flavor }}Debug"

      - name: Emülatörde çalıştır ve ekran görüntüsü al
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash ci/capture.sh ${{ matrix.kind }}

      - name: Ekran görüntülerini yükle (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RedoX-TV-ekran-${{ matrix.kind }}
          path: shots/
          if-no-files-found: warn
          retention-days: 14

      - name: Ekran görüntülerini depoya gönder (shots-${{ matrix.kind }} dalı)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -d shots ] || [ -z "$(ls -A shots)" ]; then echo "Görüntü yok."; exit 0; fi
          rm -rf /tmp/shots-repo && mkdir -p /tmp/shots-repo && cp -r shots/. /tmp/shots-repo/
          cd /tmp/shots-repo
          git init -q -b "shots-${{ matrix.kind }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Arayüz önizleme (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "shots-${{ matrix.kind }}"
